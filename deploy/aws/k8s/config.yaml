apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: interview-platform
data:
  BIND_ADDRESS: "0.0.0.0:8080"
  FRONTEND_ORIGIN: "__FRONTEND_ORIGIN__"
  MEDIA_STORAGE_DIR: "/data/media"
  ALLOW_REGISTRATION: "false"
  RUST_LOG: "info"
  DB_MAX_CONNECTIONS: "5"
  DB_ACQUIRE_TIMEOUT_SECONDS: "30"
