[package]
name = "platform-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "set-header", "cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
